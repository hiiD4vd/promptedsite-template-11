<svg width="240" height="54" viewBox="0 0 240 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing subtle back ambient -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- PromptedSite 4-point Motion Spark Symbol -->
  <g transform="translate(6, 12)">
    <!-- Central Motion Diamond Spark -->
    <path d="M15 0 C15 7.5, 22.5 15, 30 15 C22.5 15, 15 22.5, 15 30 C15 22.5, 7.5 15, 0 15 C7.5 15, 15 7.5, 15 0 Z" fill="url(#sparkGrad)" />
    <!-- Center white core spark -->
    <circle cx="15" cy="15" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- Typography: PROMPTEDSITE -->
  <text x="50" y="27" font-family="'PPNikkeiMaru-Ultrabold', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="0.12em" fill="url(#brandGrad)">
    PROMPTEDSITE
  </text>
  
  <!-- Sub-typography: MOTION PROMPT ATELIER -->
  <text x="52" y="42" font-family="'PPNikkeiMaru-Regular', 'Inter', sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.28em" fill="#9CA3AF">
    MOTION PROMPT ATELIER
  </text>
</svg>
